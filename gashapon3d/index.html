<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>立體扭蛋機</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔮</text></svg>">
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="css/gashapon3d.css">
<link rel="stylesheet" href="../shared/css/prize-frame.css">
<link rel="stylesheet" href="../shared/css/reveal-fx.css">
<link rel="stylesheet" href="../shared/css/mascot.css">
<script type="importmap">
{"imports":{"three":"../vendor/three.module.min.js"}}
</script>
<!-- 沒有這幾行的話,瀏覽器要先抓 main.js、解析、再抓 scene/track.js、再解析,
     才會發現需要 three.js —— 三層來回都在關鍵路徑上。手機的高延遲下這段最貴。
     modulepreload 讓它一看到 HTML 就並行開抓。 -->
<link rel="modulepreload" href="../vendor/three.module.min.js">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/scene.js">
</head>
<body>

<a class="home-link home-link--corner" href="../" aria-label="回首頁"><svg class="icon" aria-hidden="true"><use href="../shared/img/icons.svg#home"/></svg></a>
<div class="corner-tools">
  <button class="icon-btn" id="soundBtn" type="button" aria-label="音效開關"><svg class="icon" aria-hidden="true"><use id="soundIcon" href="../shared/img/icons.svg#sound-on"/></svg></button>
  <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定"><svg class="icon" aria-hidden="true"><use href="../shared/img/icons.svg#settings"/></svg></button>
</div>

<!-- 雪花粒子的形狀(shared/js/reveal-fx.js 的 spawnParticles 用 <use href="#snowflake"> 引用) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="snowflake" viewBox="-12 -12 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
      <path d="M0-10V10M-8.7-5 8.7 5M-8.7 5 8.7-5"/>
      <path d="M-3-7.5 0-4.5 3-7.5M-3 7.5 0 4.5 3 7.5M-7.9-1.2-4.4-2.4-5.1-6M7.9 1.2 4.4 2.4 5.1 6M-7.9 1.2-4.4 2.4-5.1 6M7.9-1.2 4.4-2.4 5.1-6"/>
    </g>
  </symbol>
</svg>

<main class="stage">
  <canvas class="scene" id="scene"></canvas>
  <p class="loading" id="loading">載入中…</p>
  <p class="pick-hint" id="pickHint">點一顆蛋打開</p>

  <div class="empty-state" id="emptyState" hidden>
    <p class="empty-state__text">扭蛋機空了!</p>
    <button class="btn btn--primary" id="refillBtn" type="button">再裝滿一次</button>
  </div>
</main>

<div class="reveal-layer">
  <div class="reveal-layer__dim" id="dim"></div>
  <div class="fx" id="fx" aria-hidden="true">
    <div class="aura" id="aura" hidden></div>
    <div class="particles" id="particles"></div>
  </div>
  <div class="prize-card prize-frame" id="prizeCard" data-rarity="N" hidden>
    <span class="prize-card__badge" id="prizeBadge"></span>
    <div class="prize-card__name-box"><p class="prize-card__name" id="prizeName"></p></div>
    <p class="skip-hint">點一下繼續</p>
  </div>
</div>

<footer class="toolbar">
  <p class="remain-tag" id="remainTag"></p>
  <div class="toolbar__buttons">
    <button class="btn btn--ghost" id="shakeBtn" type="button">搖動</button>
    <button class="btn btn--draw" id="turnBtn" type="button">抽獎</button>
  </div>
</footer>

<dialog class="dialog" id="settingsDialog">
  <header class="dialog__head">
    <h2>立體扭蛋機設定</h2>
    <button class="icon-btn icon-btn--light" id="closeBtn" type="button" aria-label="關閉">✕</button>
  </header>

  <div class="picker">
    <select class="picker__select" id="setupSelect" aria-label="選擇機台"></select>
    <button class="chip" id="addSetupBtn" type="button">＋ 新增</button>
    <button class="chip chip--danger" id="deleteSetupBtn" type="button">刪除</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="list" type="button">剩下什麼</button>
    <button class="tab" data-tab="edit" type="button">編輯獎項</button>
    <button class="tab" data-tab="other" type="button">其他</button>
  </nav>

  <div class="dialog__body">
    <section class="panel" data-panel="list">
      <p class="panel__hint" id="listHint"></p>
      <ul class="prize-list" id="prizeList"></ul>
      <button class="btn btn--ghost btn--block" id="listRefillBtn" type="button">裝滿重來</button>
    </section>

    <section class="panel" data-panel="edit" hidden>
      <ul class="edit-list" id="editList"></ul>
      <button class="btn btn--ghost btn--block" id="addPrizeBtn" type="button">＋ 新增獎項</button>
    </section>

    <section class="panel" data-panel="other" hidden>
      <label class="field">
        <span class="field__label">機台的名字</span>
        <input class="field__input" id="nameInput" type="text" maxlength="20" placeholder="我的立體扭蛋機">
      </label>
      <label class="switch">
        <input type="checkbox" id="removeInput">
        <span class="switch__box"></span>
        <span class="switch__text">抽到的就拿走<small>關掉的話同一個獎可以一直抽到</small></span>
      </label>
      <label class="switch">
        <input type="checkbox" id="soundInput">
        <span class="switch__box"></span>
        <span class="switch__text">音效<small>這個設定所有模式共用</small></span>
      </label>
    </section>
  </div>

  <footer class="dialog__foot">
    <button class="btn btn--ghost" id="cancelBtn" type="button">取消</button>
    <button class="btn btn--primary" id="confirmBtn" type="button">確定</button>
  </footer>
</dialog>

<dialog class="dialog dialog--ask" id="askDialog">
  <p class="ask__text" id="askText"></p>
  <div class="ask__buttons">
    <button class="btn btn--ghost" id="askNo" type="button">不要</button>
    <button class="btn btn--primary" id="askYes" type="button">好</button>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
<script type="module">
  import { mountSnow } from '../shared/js/snow.js';
  mountSnow();
</script>
</body>
</html>
