<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>mascot check</title>
<link rel="stylesheet" href="shared/css/tokens.css">
<link rel="stylesheet" href="shared/css/mascot.css">
<style>
  body {
    display: flex; gap: 48px; flex-wrap: wrap; padding: 48px;
    background: var(--sky-low, #eaf4fb);
    font-family: system-ui, sans-serif;
  }
  .cell {
    width: 380px;
    background: var(--cream);
    border: var(--stroke) solid var(--ink);
    border-radius: var(--radius);
    padding: 16px 20px 24px;
    box-sizing: border-box;
  }
  .cell h2 {
    font-size: 20px; margin: 0 0 8px; color: var(--ink);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .cell p { font-size: 13px; color: var(--ink); opacity: .7; margin: 0 0 10px; }
  .cell .mascots { position: static; width: 100%; }
  /* 80px 高是它在手機角落的實際使用尺寸。 */
  .real-size {
    display: flex; align-items: flex-end; gap: 10px; margin-top: 14px;
    padding-top: 10px; border-top: 2px dashed var(--cream-deep, #e6d6bd);
  }
  .real-size .mascots { width: 114px; }
  .real-size span { font-size: 11px; color: var(--ink); opacity: .7; }
</style>
</head><body>
<script type="module">
  import { mountMascots } from './shared/js/mascot.js';

  // doze 不是 pose,不能用 setPose('doze') 切過去(會被擋掉)——
  // 這裡直接改 class 名稱來「看」那張圖長什麼樣,純粹是檢查頁的手法,
  // 不代表 doze 是可以從外部指定的姿勢。
  const DOZE_IMG_URL = new URL('./shared/img/mascot/doze.webp', import.meta.url).href;

  for (const pose of ['idle', 'watch', 'cheer', 'aww', 'empty', 'doze']) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const h = document.createElement('h2');
    h.textContent = pose;
    cell.append(h);
    if (pose === 'doze') {
      const p = document.createElement('p');
      p.textContent = 'doze 不是 pose,只在待機排程裡出現;這裡用手動換圖看它長什麼樣。';
      cell.append(p);
    }
    document.body.append(cell);

    const big = mountMascots({ fidget: false });
    cell.append(big.el);        // mountMascots 會 append 到 body,這裡搬進格子裡
    if (pose === 'doze') {
      big.el.querySelectorAll('.mascots__img')[0].src = DOZE_IMG_URL;
      big.el.querySelectorAll('.mascots__img')[0].classList.add('mascots__img--visible');
    } else {
      big.setPose(pose);
    }

    const realRow = document.createElement('div');
    realRow.className = 'real-size';
    const small = mountMascots({ fidget: false });
    realRow.append(small.el);
    if (pose === 'doze') {
      small.el.querySelectorAll('.mascots__img')[0].src = DOZE_IMG_URL;
      small.el.querySelectorAll('.mascots__img')[0].classList.add('mascots__img--visible');
    } else {
      small.setPose(pose);
    }
    const label = document.createElement('span');
    label.textContent = '實際大小(80px 高)';
    realRow.append(label);
    cell.append(realRow);
  }
</script>
</body></html>
