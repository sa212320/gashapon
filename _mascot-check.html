<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>mascot check</title>
<link rel="stylesheet" href="shared/css/tokens.css">
<link rel="stylesheet" href="shared/css/mascot.css">
<style>
  body {
    display: flex; gap: 48px; flex-wrap: wrap; padding: 48px;
    background: var(--sky-low, #eaf4fb);
    font-family: system-ui, sans-serif;
  }
  .cell {
    width: 380px;
    background: var(--cream);
    border: var(--stroke) solid var(--ink);
    border-radius: var(--radius);
    padding: 16px 20px 24px;
    box-sizing: border-box;
  }
  .cell h2 {
    font-size: 20px; margin: 0 0 8px; color: var(--ink);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .cell .mascots { position: static; width: 100%; }
  /* 80px 高是它在手機角落的實際使用尺寸(viewBox 200x140,
     寬高比 10:7,80px 高 = 114px 寬)。縮到這個尺寸還看不出
     「狐狸抱著白鼬」,細節加再多都沒用。 */
  .real-size {
    display: flex; align-items: flex-end; gap: 10px; margin-top: 14px;
    padding-top: 10px; border-top: 2px dashed var(--cream-deep, #e6d6bd);
  }
  .real-size .mascots { width: 114px; }
  .real-size span { font-size: 11px; color: var(--ink); opacity: .7; }
</style>
</head><body>
<script type="module">
  import { mountMascots } from './shared/js/mascot.js';
  for (const pose of ['idle', 'aww']) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const h = document.createElement('h2');
    h.textContent = pose;
    cell.append(h);
    document.body.append(cell);

    const big = mountMascots();
    cell.append(big.el);        // mountMascots 會 append 到 body,這裡搬進格子裡
    big.setPose(pose);

    const realRow = document.createElement('div');
    realRow.className = 'real-size';
    const small = mountMascots();
    realRow.append(small.el);
    small.setPose(pose);
    const label = document.createElement('span');
    label.textContent = '實際大小(80px 高)';
    realRow.append(label);
    cell.append(realRow);
  }
</script>
</body></html>
