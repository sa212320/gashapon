<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>阿彌陀籤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪜</text></svg>">
<link rel="stylesheet" href="../shared/css/tokens.css">
<link rel="stylesheet" href="css/ghostleg.css">
<script type="importmap">
{"imports":{"three":"../vendor/three.module.min.js"}}
</script>
<!-- 沒有這幾行的話,瀏覽器要先抓 main.js、解析、再抓 scene/track.js、再解析,
     才會發現需要 three.js —— 三層來回都在關鍵路徑上。手機的高延遲下這段最貴。
     modulepreload 讓它一看到 HTML 就並行開抓。 -->
<link rel="modulepreload" href="../vendor/three.module.min.js">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/track.js">
</head>
<body>

<header class="topbar">
  <a class="home-link" href="../" aria-label="回首頁">←</a>
  <h1 class="setup-name" id="setupName">阿彌陀籤</h1>
  <p class="remaining" id="remaining"></p>
</header>

<main class="stage">
  <canvas class="track" id="track"></canvas>
  <p class="loading" id="loading">載入中…</p>

  <div class="empty-state" id="emptyState" hidden>
    <div class="empty-state__icon">🪜</div>
    <p class="empty-state__text">至少要兩個人才跑得起來</p>
    <button class="btn btn--primary" id="emptySettingsBtn" type="button">去加人</button>
  </div>

  <!-- 結果清單。40 個人的結果不可能在一個畫面上讀完,而且老師要抄下來。 -->
  <section class="results" id="results" hidden>
    <h2 class="results__head">結果</h2>
    <ol class="results__list" id="resultList"></ol>
    <button class="btn btn--primary" id="againBtn" type="button">再跑一次</button>
  </section>
</main>

<footer class="toolbar">
  <button class="icon-btn" id="soundBtn" type="button" aria-label="音效開關"><span id="soundIcon">🔊</span></button>
  <button class="btn btn--primary btn--go" id="startBtn" type="button">開始</button>
  <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙️</button>
</footer>

<dialog class="dialog" id="settingsDialog">
  <header class="dialog__head">
    <h2>阿彌陀籤設定</h2>
    <button class="icon-btn icon-btn--light" id="closeBtn" type="button" aria-label="關閉">✕</button>
  </header>

  <div class="picker">
    <select class="picker__select" id="setupSelect" aria-label="選擇一組設定"></select>
    <button class="chip" id="addSetupBtn" type="button">＋ 新增</button>
    <button class="chip chip--danger" id="deleteSetupBtn" type="button">刪除</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="players" type="button">誰要抽</button>
    <button class="tab" data-tab="prizes" type="button">抽什麼</button>
    <button class="tab" data-tab="other" type="button">其他</button>
  </nav>

  <div class="dialog__body">
    <section class="panel" data-panel="players">
      <p class="panel__hint" id="playerHint"></p>
      <ul class="edit-list" id="playerList"></ul>
      <button class="btn btn--ghost btn--block" id="addPlayerBtn" type="button">＋ 新增一個人</button>
    </section>

    <section class="panel" data-panel="prizes" hidden>
      <p class="panel__hint" id="prizeHint"></p>
      <ul class="edit-list" id="prizeList"></ul>
      <button class="btn btn--ghost btn--block" id="addPrizeBtn" type="button">＋ 新增獎項</button>
    </section>

    <section class="panel" data-panel="other" hidden>
      <label class="field">
        <span class="field__label">這組設定的名字</span>
        <input class="field__input" id="nameInput" type="text" maxlength="20" placeholder="我的阿彌陀籤">
      </label>
      <label class="switch">
        <input type="checkbox" id="soundInput">
        <span class="switch__box"></span>
        <span class="switch__text">音效<small>這個設定所有模式共用</small></span>
      </label>
    </section>
  </div>

  <footer class="dialog__foot">
    <button class="btn btn--ghost" id="cancelBtn" type="button">取消</button>
    <button class="btn btn--primary" id="confirmBtn" type="button">確定</button>
  </footer>
</dialog>

<dialog class="dialog dialog--ask" id="askDialog">
  <p class="ask__text" id="askText"></p>
  <div class="ask__buttons">
    <button class="btn btn--ghost" id="askNo" type="button">不要</button>
    <button class="btn btn--primary" id="askYes" type="button">好</button>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
