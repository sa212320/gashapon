<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<title>扭蛋機</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🥚</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="topbar">
  <h1 class="machine-name" id="machineName">扭蛋機</h1>
  <p class="remaining" id="remaining"></p>
</header>

<main class="stage" id="stage">
  <svg class="machine" id="machine" viewBox="0 0 220 300" aria-hidden="true">
    <ellipse class="machine__shadow" cx="110" cy="284" rx="86" ry="13"/>
    <rect class="machine__body" x="18" y="148" width="184" height="126" rx="28"/>
    <rect class="machine__panel" x="40" y="222" width="140" height="44" rx="16"/>
    <circle class="machine__dome" cx="110" cy="100" r="82"/>
    <g id="capsuleGroup" class="machine__capsules"></g>
    <circle class="machine__dome-glass" cx="110" cy="100" r="82"/>
    <ellipse class="machine__shine" cx="80" cy="66" rx="24" ry="34" transform="rotate(-24 80 66)"/>
    <rect class="machine__rim" x="22" y="144" width="176" height="24" rx="12"/>
    <g class="machine__knob" id="knob">
      <circle class="machine__knob-base" cx="110" cy="192" r="25"/>
      <rect class="machine__knob-bar" x="96" y="186" width="28" height="12" rx="6"/>
    </g>
    <rect class="machine__slot" x="74" y="232" width="72" height="28" rx="12"/>
  </svg>

  <div class="overlay" id="overlay" hidden>
    <div class="aura" id="aura" hidden></div>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="capsule" id="capsule" data-rarity="N" hidden>
      <span class="capsule__half capsule__half--top" id="capsuleTop"></span>
      <span class="capsule__half capsule__half--bottom" id="capsuleBottom"></span>
    </div>
    <div class="prize-card" id="prizeCard" hidden>
      <span class="prize-card__badge" id="prizeBadge"></span>
      <p class="prize-card__name" id="prizeName"></p>
      <button class="btn btn--primary" id="againBtn" type="button">再抽一次</button>
    </div>
    <p class="skip-hint" id="skipHint">點一下跳過</p>
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <div class="empty-state__egg">🥚</div>
    <p class="empty-state__text">扭蛋機空了!</p>
    <button class="btn btn--primary" id="refillBtn" type="button">再裝滿一次</button>
  </div>
</main>

<footer class="toolbar">
  <button class="icon-btn" id="soundBtn" type="button" aria-label="音效開關"><span id="soundIcon">🔊</span></button>
  <button class="btn btn--draw" id="drawBtn" type="button">轉!</button>
  <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定">⚙️</button>
</footer>

<dialog class="dialog" id="settingsDialog">
  <header class="dialog__head">
    <h2>扭蛋機設定</h2>
    <button class="icon-btn icon-btn--light" id="closeBtn" type="button" aria-label="關閉">✕</button>
  </header>

  <div class="picker">
    <select class="picker__select" id="machineSelect" aria-label="選擇扭蛋機"></select>
    <button class="chip" id="addMachineBtn" type="button">＋ 新增</button>
    <button class="chip chip--danger" id="deleteMachineBtn" type="button">刪除</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="list" type="button">剩下什麼</button>
    <button class="tab" data-tab="edit" type="button">編輯獎項</button>
    <button class="tab" data-tab="other" type="button">其他</button>
  </nav>

  <div class="dialog__body">
    <section class="panel" data-panel="list">
      <p class="panel__hint" id="listHint"></p>
      <ul class="prize-list" id="prizeList"></ul>
      <button class="btn btn--ghost btn--block" id="listRefillBtn" type="button">把扭蛋機裝滿重來</button>
    </section>

    <section class="panel" data-panel="edit" hidden>
      <ul class="edit-list" id="editList"></ul>
      <button class="btn btn--ghost btn--block" id="addPrizeBtn" type="button">＋ 新增獎項</button>
    </section>

    <section class="panel" data-panel="other" hidden>
      <label class="field">
        <span class="field__label">扭蛋機名字</span>
        <input class="field__input" id="nameInput" type="text" maxlength="20" placeholder="我的扭蛋機">
      </label>
      <label class="switch">
        <input type="checkbox" id="removeOnDrawInput">
        <span class="switch__box"></span>
        <span class="switch__text">抽到的就拿走<small>關掉的話,同一個獎可以一直抽到</small></span>
      </label>
      <label class="switch">
        <input type="checkbox" id="soundInput">
        <span class="switch__box"></span>
        <span class="switch__text">音效<small>這個設定所有扭蛋機共用</small></span>
      </label>
    </section>
  </div>

  <footer class="dialog__foot">
    <button class="btn btn--ghost" id="cancelBtn" type="button">取消</button>
    <button class="btn btn--primary" id="confirmBtn" type="button">確定</button>
  </footer>
</dialog>

<dialog class="dialog dialog--ask" id="askDialog">
  <p class="ask__text" id="askText"></p>
  <div class="ask__buttons">
    <button class="btn btn--ghost" id="askNo" type="button">不要</button>
    <button class="btn btn--primary" id="askYes" type="button">好</button>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
