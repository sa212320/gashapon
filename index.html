<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<title>抽獎小工具</title>
<link rel="stylesheet" href="shared/css/tokens.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<header class="home-head">
  <h1>要玩哪一個?</h1>
</header>
<main class="home-grid">
  <a class="card" href="gashapon/">
    <span class="card__art card__art--gashapon" aria-hidden="true"></span>
    <span class="card__name">扭蛋機</span>
    <span class="card__desc">搖越多次越大獎</span>
  </a>
  <div class="card card--soon" aria-disabled="true">
    <span class="card__art card__art--gashapon3d" aria-hidden="true"></span>
    <span class="card__name">立體扭蛋機</span>
    <span class="card__desc">看蛋在球裡滾來滾去</span>
    <span class="card__soon">還在做</span>
  </div>
  <a class="card" href="ichiban/">
    <span class="card__art card__art--ichiban" aria-hidden="true"></span>
    <span class="card__name">一番賞</span>
    <span class="card__desc">抽一張,撕開看是幾賞</span>
  </a>
  <a class="card" href="ghostleg/">
    <span class="card__art card__art--ghostleg" aria-hidden="true"></span>
    <span class="card__name">阿彌陀籤</span>
    <span class="card__desc">沿著線一路跑到終點</span>
  </a>
  <div class="card card--soon" aria-disabled="true">
    <span class="card__art card__art--smash" aria-hidden="true"></span>
    <span class="card__name">大亂鬥</span>
    <span class="card__desc">撞出場外就淘汰</span>
    <span class="card__soon">還在做</span>
  </div>
</main>
</body>
</html>
